<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Editable Kitty TikTok Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Comfortaa', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Милая кошачья рамка с розовым градиентом */
        .kitty-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 320px;
            height: 120px;
            background: radial-gradient(circle, #fff4f8 0%, #ffdbe9 100%);
            border-radius: 28px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 14px 40px rgba(255, 77, 148, 0.35);
            
            border: 4px solid #fff;
            
            position: relative;
            animation: gentleGlow 3s infinite alternate;
        }

        .kitty-widget::before, .kitty-widget::after {
            content: "🐾";
            font-size: 18px;
            position: absolute;
            pointer-events: none; /* Чтобы значки не мешали кликать по тексту */
        }
        .kitty-widget::before { top: 8px; left: 12px; }
        .kitty-widget::after { bottom: 8px; right: 12px; }

        @keyframes gentleGlow {
            0% { transform: scale(1); box-shadow: 0 10px 30px rgba(255, 77, 148, 0.3); }
            100% { transform: scale(1.02); box-shadow: 0 15px 40px rgba(255, 143, 194, 0.5); }
        }

        .text-container {
            width: 100%;
        }

        /* Стили заголовка (розовый текст) */
        .kitty-title {
            font-family: 'Pacifico', cursive;
            background: linear-gradient(180deg, #ff8fc2, #ff4d94);
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
            font-size: 24px;
            margin: 0 0 6px 0;
            filter: drop-shadow(0px 2px 0px #fff);
            outline: none; /* Убираем стандартную синюю рамку при редактировании */
            cursor: text;
        }

        /* Стили подзаголовка */
        .kitty-sub {
            color: #8a2552;
            font-size: 13px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
            outline: none;
            cursor: text;
            opacity: 0.85;
        }

        /* Подсветка текста при наведении, чтобы стример понимал, что сюда можно кликнуть */
        .kitty-title:hover, .kitty-sub:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="kitty-widget">
        <div class="text-container">
            <!-- contenteditable="true" разрешает редактирование текста пользователем -->
            <p class="kitty-title" contenteditable="true">@твой_никнейм</p>
            <p class="kitty-sub" contenteditable="true">Кликни здесь, чтобы изменить текст</p>
        </div>
    </div>

</body>
</html>

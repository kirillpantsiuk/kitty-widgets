<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty cat widget</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Comfortaa','Nunito',system-ui,sans-serif}
.stage{position:absolute;inset:0;overflow:hidden}
.cat{position:absolute;bottom:6px;transform-origin:50% 100%}
.cat svg{width:100%;height:100%;overflow:visible;display:block}
.tail{transform-origin:150px 236px;animation:tail 2.6s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.body{transform-origin:115px 250px;animation:breath 3.2s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.015,1.025)}}
.head{transform-origin:115px 160px;animation:tilt 5.5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.earL{transform-origin:80px 70px;animation:twl 6s ease-in-out infinite}
.earR{transform-origin:150px 70px;animation:twr 6s ease-in-out infinite 1s}
@keyframes twl{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(3deg)}}
@keyframes twr{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(12deg)}95%{transform:rotate(-3deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.arm{transform-origin:170px 176px}
.pHead{transform-origin:160px 204px;animation:tilt 5.5s ease-in-out infinite}
.pEarL{transform-origin:100px 84px;animation:twl 6s ease-in-out infinite}
.pEarR{transform-origin:220px 84px;animation:twr 6s ease-in-out infinite 1s}
.pEye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.pArm{transform-origin:262px 206px;transform:rotate(8deg);animation:armidle 3s ease-in-out infinite}
@keyframes armidle{0%,100%{transform:rotate(6deg)}50%{transform:rotate(12deg)}}
.ref{isolation:isolate}
.rl{position:absolute;inset:0;isolation:isolate}
.rl .im,.rl .tn{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.rl .tn{background:var(--coat);mix-blend-mode:multiply}
.rBody .im{background-image:var(--refBody)}
.rBody .tn{-webkit-mask-image:var(--refBody);mask-image:var(--refBody)}
.rArm{transform-origin:82.28% 80.48%;animation:armidle2 3s ease-in-out infinite}
.rArm .im{background-image:var(--refArm)}
.rArm .tn{-webkit-mask-image:var(--refArm);mask-image:var(--refArm)}
@keyframes armidle2{0%,100%{transform:rotate(0deg)}50%{transform:rotate(5deg)}}
.rAcc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.sc .s-mv,.sc .s-cat,.sc .s-head,.sc .s-tail,.sc .s-ear,.sc .s-eye,.sc .s-leg,.sc .s-zzz text{transform-box:fill-box}
.sc .s-mv{transform-origin:50% 100%}
.sc .s-cat{transform-origin:50% 100%;animation:sc-breathe 3.6s ease-in-out infinite}
@keyframes sc-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.016)}}
.sc .s-head{transform-origin:50% 100%;animation:sc-head 5.2s ease-in-out infinite}
@keyframes sc-head{0%,100%{transform:rotate(-1.8deg) translateY(0)}50%{transform:rotate(1.8deg) translateY(-7px)}}
.sc .s-tail{transform-origin:var(--to,50% 100%);animation:sc-tail 2.6s ease-in-out infinite}
@keyframes sc-tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
.sc .s-ear{transform-origin:50% 100%}
.sc .s-earL{animation:sc-twl 6.4s ease-in-out infinite}
.sc .s-earR{animation:sc-twr 7.1s ease-in-out infinite}
@keyframes sc-twl{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-10deg)}95%{transform:rotate(3deg)}}
@keyframes sc-twr{0%,84%,100%{transform:rotate(0)}89%{transform:rotate(10deg)}94%{transform:rotate(-3deg)}}
.sc .s-eye{transform-origin:50% 50%;animation:sc-blink 4.8s infinite}
@keyframes sc-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}}
.sc .s-leg{transform-origin:100% 30%;animation:sc-leg 1.3s ease-in-out infinite}
@keyframes sc-leg{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.sc .s-m4{animation:sc-walk 1.3s ease-in-out infinite}
@keyframes sc-walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.sc .s-zzz text{transform-origin:50% 50%;font-family:'Comfortaa','Arial Rounded MT Bold',Arial,sans-serif;font-weight:700;fill:#7f93c9;opacity:0;animation:sc-z 3.6s ease-in-out infinite}
@keyframes sc-z{0%{opacity:0;transform:translate(0,30px) scale(.6)}25%{opacity:.95}100%{opacity:0;transform:translate(40px,-90px) scale(1.15)}}
.bub{position:absolute;left:50%;bottom:100%;margin-bottom:-6px;padding:8px 16px;border-radius:18px;background:#fff;border:2.5px solid #ff8fc2;color:#8a2552;font-weight:700;font-size:18px;white-space:nowrap;box-shadow:0 6px 16px rgba(255,77,148,.25);transform-origin:50% 100%;animation:bub .5s cubic-bezier(.2,1.5,.4,1) .9s both}
.bub::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2.5px solid #ff8fc2;border-bottom:2.5px solid #ff8fc2;transform:translateX(-50%) rotate(45deg)}
@keyframes bub{from{opacity:0;transform:translateX(-50%) scale(.2)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.dst{position:absolute;pointer-events:none;z-index:9;text-shadow:0 0 4px #fff;animation:dst 1.7s ease-out forwards}
@keyframes dst{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
</style>

const SETR = [0.7151, 1.0268, 1.25, 0.7101, 0.9676, 0.5054];
function pickSet(i){
  const v = cfg.setCat;
  if (v === "all") return (i + round - 1 + 60) % 6;
  if (v === "random") return Math.floor(Math.random() * 6);
  return clamp(parseInt(v) || 0, 0, 5);
}
function burst(el, n){
  const S = $("stage"), s = S.getBoundingClientRect(), r = el.getBoundingClientRect(), ch = ["♥", "♥", "✦", "🐾", "♡"], cols = ["#ff8fc2", "#ff4d94", "#fff", "#ffb3d4"];
  for (let i = 0; i < n; i++){
    const d = document.createElement("span"); d.className = "dst"; d.textContent = ch[i % 5];
    d.style.cssText = `left:${r.left - s.left + Math.random() * r.width}px;top:${r.top - s.top + Math.random() * r.height}px;font-size:${12 + Math.random() * 16}px;color:${cols[i % 4]};--dx:${(Math.random() - .5) * 140}px;--dy:${-60 - Math.random() * 130}px;animation-delay:${Math.random() * .5}s`;
    S.appendChild(d); setTimeout(() => d.remove(), 2600);
  }
}
function wave(c){
  if (c.el.classList.contains("sc")){
    if (!(cfg.waveSec > 0)) return;
    const hops = Math.max(1, Math.round(cfg.waveSec / 0.8));
    c.el.animate([{transform:"translateY(0) scale(1,1)"}, {transform:"translateY(0) scale(1.05,.92)", offset:.15}, {transform:"translateY(-7%) scale(.97,1.05)", offset:.5}, {transform:"translateY(0) scale(1.04,.94)", offset:.8}, {transform:"translateY(0) scale(1,1)"}], {duration:800, iterations:hops, easing:"ease-in-out"});
    burst(c.el, 10); return;
  }
  const ra = c.el.querySelector(".rArm");
  if (ra){
    if (!(cfg.waveSec > 0)) return;
    const n = Math.max(2, Math.round(cfg.waveSec * 2.4)), kf = [{transform:"rotate(0deg)", offset:0}];
    for (let i = 0; i < n; i++) kf.push({transform:`rotate(${i % 2 ? -5 : 10}deg)`, offset:(i + 1) / (n + 1)});
    kf.push({transform:"rotate(0deg)", offset:1});
    ra.animate(kf, {duration:cfg.waveSec * 1000, easing:"ease-in-out"}); return;
  }
  const pa = c.el.querySelector(".pArm");
  if (pa){
    if (!(cfg.waveSec > 0)) return;
    const n = Math.max(2, Math.round(cfg.waveSec * 2.4)), kf = [{transform:"rotate(8deg)", offset:0}];
    for (let i = 0; i < n; i++) kf.push({transform:`rotate(${i % 2 ? -8 : 30}deg)`, offset:(i + 1) / (n + 1)});
    kf.push({transform:"rotate(8deg)", offset:1});
    pa.animate(kf, {duration:cfg.waveSec * 1000, easing:"ease-in-out"}); return;
  }
  if (!(cfg.waveSec > 0)) return;
  const arm = c.el.querySelector(".arm"), n = Math.max(2, Math.round(cfg.waveSec * 2.2));
  const kf = [{transform:"rotate(0deg)", offset:0}, {transform:"rotate(-150deg)", offset:.12}];
  for (let i = 0; i < n; i++) kf.push({transform:`rotate(${i % 2 ? -126 : -170}deg)`, offset:.12 + .76 * (i + 1) / n});
  kf.push({transform:"rotate(-150deg)", offset:.9}, {transform:"rotate(0deg)", offset:1});
  arm.animate(kf, {duration:cfg.waveSec * 1000, easing:"ease-in-out"});
}
function enter(c, W, H){
  const d = c.i * 350, e = c.el, dir = (c.left + c.w / 2) < W / 2 ? -1 : 1, x = dir < 0 ? -(c.left + c.w + 20) : (W - c.left + 20);
  let kf, dur = 900, ez = "ease-out";
  if (cfg.enter === "peek"){ kf = [{transform:`translateX(${x}px) rotate(${dir * 25}deg)`}, {transform:"translateX(0) rotate(0)"}]; dur = 1000; ez = "cubic-bezier(.2,1.3,.4,1)"; }
  else if (cfg.enter === "drop"){ kf = [{transform:`translateY(${-H}px)`}, {transform:"translateY(0)", offset:.55}, {transform:"translateY(-9%)", offset:.72}, {transform:"translateY(0)", offset:.86}, {transform:"translateY(-3%)", offset:.94}, {transform:"translateY(0)"}]; dur = 1200; ez = "ease-in-out"; }
  else if (cfg.enter === "pop"){ kf = [{transform:"scale(0) rotate(-25deg)", opacity:0}, {transform:"scale(1.15) rotate(6deg)", opacity:1, offset:.7}, {transform:"scale(1) rotate(0)", opacity:1}]; dur = 700; }
  else kf = [{transform:"translateY(120%)"}, {transform:"translateY(-6%)", offset:.72}, {transform:"translateY(0)"}];
  e.animate(kf, {duration:dur, delay:d, easing:ez, fill:"backwards"});
  if (cfg.enter === "pop") t(() => burst(e, 14), d + 350);
  t(() => wave(c), d + dur - 100);
}
function exitCat(c){
  const e = c.el, d = c.i * 150, W = $("stage").clientWidth, dir = (c.left + c.w / 2) < W / 2 ? -1 : 1, x = dir < 0 ? -(c.left + c.w + 20) : (W - c.left + 20);
  let kf, dur = 900;
  if (cfg.exit === "sink") kf = [{transform:"translateY(0)"}, {transform:"translateY(-8%)", offset:.25}, {transform:"translateY(125%)"}];
  else if (cfg.exit === "shrink"){ kf = [{transform:"scale(1) rotate(0)", opacity:1}, {transform:"scale(0) rotate(540deg)", opacity:0}]; dur = 1000; }
  else if (cfg.exit === "slide") kf = [{transform:"translate(0,0)"}, {transform:`translate(${x * .12}px,-30px)`, offset:.2}, {transform:`translate(${x}px,0)`}];
  else { kf = [{opacity:1, filter:"blur(0px)", transform:"translateY(0) scale(1)"}, {opacity:0, filter:"blur(10px)", transform:"translateY(-30px) scale(.92)"}]; dur = 1400; t(() => burst(e, 26), d); }
  e.animate(kf, {duration:dur, delay:d, easing:"ease-in", fill:"forwards"});
}
function killCats(){ cats.forEach(c => c.el.remove()); cats = []; }
function spawn(){
  const st = $("stage"), W = st.clientWidth, n = clamp(cfg.count, 1, 5), h = cfg.size, peek = cfg.shape === "peeker", isRef = cfg.shape === "ref", isSet = cfg.shape === "set";
  const ids = Array.from({length:n}, (_, k) => isSet ? pickSet(k) : 0);
  const wOf = k => isSet ? h * SETR[ids[k]] : isRef ? h * REF.w / REF.h : peek ? h * 320 / 240 : h * 230 / 270;
  const sp = ids.reduce((a, _, k) => a + wOf(k), 0) / n * .8, setTotal = ids.reduce((a, _, k) => a + wOf(k) * .94, 0); let setAcc = 0;
  const base = ({center:.5, left:.24, right:.76})[cfg.place] ?? (.15 + Math.random() * .7);
  for (let i = 0; i < n; i++){
    const w = wOf(i);
    const el = document.createElement("div"); el.className = "cat" + (isRef ? " ref" : "") + (isSet ? " sc" : "");
    const pal = isRef ? PALR : PAL, coat = (cfg.varyColors && i > 0) ? pal[(i - 1 + round) % pal.length] : cfg.coat;
    el.style.cssText = `--coat:${coat};--eye:${cfg.eyes};--acc:${cfg.acc};width:${w}px;height:${h}px`;
    el.innerHTML = isSet ? SETSVG[ids[i]] : isRef ? refHTML({accessory:cfg.accessory}) : (peek ? peekSVG : catSVG)({shape:cfg.shape, pattern:cfg.pattern, accessory:cfg.accessory, coat, wink:cfg.wink, ledge:cfg.ledge, bd:(Math.random() * 3).toFixed(1)});
    if (isSet) el.querySelectorAll(".s-cat,.s-head,.s-tail,.s-ear,.s-eye,.s-leg,.s-mv").forEach(e => e.style.animationDelay = "-" + (Math.random() * 5).toFixed(2) + "s");
    if (i === 0 && cfg.bubble){ const b = document.createElement("div"); b.className = "bub"; b.textContent = cfg.bubble; el.appendChild(b); }
    const left = clamp(isSet ? base * W - setTotal / 2 + setAcc : base * W + (i - (n - 1) / 2) * sp - w / 2, 0, Math.max(0, W - w)); setAcc += w * .94;
    el.style.left = left + "px"; st.appendChild(el);
    const c = {el, left, i, w}; cats.push(c); enter(c, W, st.clientHeight);
  }
}

function appear(){
  killCats(); round++; spawn();
  const n = cats.length, enterT = 1000 + (n - 1) * 350;
  t(() => {
    cats.forEach(exitCat);
    t(() => { killCats(); if (cfg.visible && (cfg.rounds === 0 || round < cfg.rounds)) t(appear, Math.max(1, cfg.hideFor) * 1000); }, 1600 + (n - 1) * 150);
  }, enterT + Math.max(1, cfg.showFor) * 1000);
}
function restart(){
  clearAll();
  if (!cfg.visible){ if (cats.length){ cats.forEach(exitCat); t(killCats, 1700); } return; }
  killCats(); round = 0; t(appear, Math.max(0, cfg.firstDelay) * 1000);
}
function apply(c){
  cfg = Object.assign({}, DEF, c);
  cfg.count = clamp(Math.round(cfg.count) || 1, 1, 5); cfg.size = clamp(+cfg.size || 260, 120, 420); cfg.waveSec = clamp(+cfg.waveSec || 0, 0, 10);
  localStorage.setItem("kt_ct_cfg", JSON.stringify(cfg));
  const sig = [cfg.showFor, cfg.hideFor, cfg.firstDelay, cfg.rounds, cfg.visible].join();
  if (sig !== csig){ csig = sig; restart(); }
  if (lastNow === null) lastNow = cfg.now;
  else if (cfg.now && cfg.now !== lastNow){
    lastNow = cfg.now;
    if (ready && cfg.visible){ clearAll(); killCats(); round = 0; appear(); }
  }
}
apply(cfg);
if (T){
  const es = new EventSource("https://ntfy.sh/" + encodeURIComponent(T + "-kct") + "/sse?since=12h");
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") apply(JSON.parse(m.message)); } catch(_){} };
}
setTimeout(() => ready = true, 2500);
</script>
